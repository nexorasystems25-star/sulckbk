database {
    url = "jdbc:postgresql://localhost:5432/sulck"
    user = "postgres"
    password = "postgres"
    poolSize = 20
    flywayLocations = ["classpath:db/migration"]
}

server {
    host = "0.0.0.0"
    port = 8080
}

jwt {
    secret = "your-super-secret-jwt-key-change-in-production-min-32-chars"
    issuer = "sulck.app"
    audience = "sulck.app"
    accessTokenExpiryMinutes = 15
    refreshTokenExpiryDays = 30
}

paystack {
    secretKey = "sk_test_your_paystack_secret_key"
    publicKey = "pk_test_your_paystack_public_key"
    webhookSecret = "your_webhook_secret"
    baseUrl = "https://api.paystack.co"
}